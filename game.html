<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Paradux</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="game.css?v=2">
    <!--meta http-equiv="Content-Security-Policy" content=""> TODO -->
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-148912183-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'UA-148912183-1');
    </script>
</head>

<body>
    <div id="all">
        <div id="header">
            <div class="header-actions header-start">
                <button type="button" id="newGameBtn" class="toolbar-button" aria-label="New game" title="New game" onclick="requestNewGame()">
                    <span class="toolbar-icon" aria-hidden="true">↻</span>
                </button>
                <span id="gameResult" role="status"></span>
            </div>
            <h1 id="title">Paradux</h1>
            <div class="header-actions header-end">
                <span id="localTurnMarble" class="turn-marble" role="img" hidden></span>
                <span id="teamEmoji" class="turn-marble" role="img"></span>
                <div class="dropdown">
                    <button type="button" id="multSettBtn" class="toolbar-button" aria-label="Online" title="Online"
                        aria-controls="myDropdown2" aria-expanded="false" onclick="toggleDropdown(this)">
                        <span class="toolbar-icon globe-icon" aria-hidden="true"></span>
                    </button>
                    <section id="myDropdown2" class="dropdown-content online-panel" aria-labelledby="onlineTitle">
                        <div class="panel-heading">
                            <h2 id="onlineTitle">Online play</h2>
                            <button type="button" class="panel-close" aria-label="Close Online" onclick="dismissDropdown()">×</button>
                        </div>
                        <div class="online-status">
                            <p id="onlineStatus" data-state="idle" role="status">Start a game and send the invite link to a friend.</p>
                        </div>
                        <div id="onlineInvite" class="online-invite" hidden>
                            <label for="inviteURL">Invite link</label>
                            <input id="inviteURL" type="url" readonly>
                            <button type="button" id="linkBtn" class="panel-button panel-primary" onclick="copyLink()">Copy invite link</button>
                            <p id="copyStatus" role="status"></p>
                        </div>
                        <button type="button" id="eMultiBtn" class="panel-button panel-primary" onclick="toggleOnline()">Start online game</button>
                        <button type="button" id="leaveInviteBtn" class="panel-button" onclick="leaveOnline()" hidden>Leave invite</button>
                    </section>
                </div>
                <div class="dropdown">
                    <button type="button" class="toolbar-button" aria-label="Settings" title="Settings"
                        aria-controls="myDropdown" aria-expanded="false" onclick="toggleDropdown(this)">
                        <span class="toolbar-icon sliders-icon" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                    </button>
                    <section id="myDropdown" class="dropdown-content settings-panel" aria-labelledby="settingsTitle">
                        <div class="panel-heading">
                            <h2 id="settingsTitle">Settings</h2>
                            <button type="button" class="panel-close" aria-label="Close Settings" onclick="dismissDropdown()">×</button>
                        </div>
                        <div class="settings-options">
                            <div class="setting-row">
                                <span id="uiSizeLabel">UI size</span>
                                <div class="size-stepper" role="group" aria-labelledby="uiSizeLabel">
                                    <button type="button" id="downSize" aria-label="Decrease UI size" onclick="changeSize(-10)">−</button>
                                    <output id="fontText" aria-live="polite">100%</output>
                                    <button type="button" id="upSize" aria-label="Increase UI size" onclick="changeSize(10)">+</button>
                                </div>
                            </div>
                            <label class="setting-row">
                                <span>Highlight on hover</span>
                                <input type="checkbox" class="panel-switch" id="hoverBtn" onchange="changeHover()">
                            </label>
                            <label class="setting-row">
                                <span>Show turns in local play</span>
                                <input type="checkbox" class="panel-switch" id="localTurnLabels" onchange="changeLocalTurnLabels()">
                            </label>
                        </div>
                        <div class="theme-section">
                            <h3 id="themeTitle">Board theme</h3>
                            <div id="themeChoices" class="theme-grid" role="group" aria-labelledby="themeTitle">
                                <button type="button" class="theme-card" data-theme="def" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#a1b575; --preview-board:#ba9b70"></span>
                                    Classic
                                </button>
                                <button type="button" class="theme-card" data-theme="wood2" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#6e5138; --preview-board:#b98d59"></span>
                                    Wooden table
                                </button>
                                <button type="button" class="theme-card" data-theme="grass" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#57752f; --preview-board:#c4a473"></span>
                                    Grass
                                </button>
                                <button type="button" class="theme-card" data-theme="sand" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#c5ad7c; --preview-board:#8b9a59"></span>
                                    Sand
                                </button>
                                <button type="button" class="theme-card" data-theme="black" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#2d3035; --preview-board:#767f8e"></span>
                                    Slate
                                </button>
                                <button type="button" class="theme-card" data-theme="blue" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#365381; --preview-board:#a27391"></span>
                                    Blue
                                </button>
                                <button type="button" class="theme-card" data-theme="cinder" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#29292c; --preview-board:#ac4242"></span>
                                    Cinder
                                </button>
                                <button type="button" class="theme-card" data-theme="bluewood" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#466075; --preview-board:#c5b657"></span>
                                    Blue wood
                                </button>
                                <button type="button" class="theme-card" data-theme="sofa" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#647880; --preview-board:#d6b68c"></span>
                                    Sofa
                                </button>
                                <button type="button" class="theme-card" data-theme="street" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#43403c; --preview-board:#c69247"></span>
                                    Dark marble
                                </button>
                                <button type="button" class="theme-card" data-theme="egypt" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#d9d3bc; --preview-board:#bfb07a"></span>
                                    Marble
                                </button>
                                <button type="button" class="theme-card" data-theme="carpet" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#37323c; --preview-board:#a980c2"></span>
                                    Carpet
                                </button>
                                <button type="button" class="theme-card" data-theme="deck" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#8e6248; --preview-board:#a7b46e"></span>
                                    Deck
                                </button>
                                <button type="button" class="theme-card" data-theme="grill" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#403b3a; --preview-board:#95758b"></span>
                                    Coal
                                </button>
                                <button type="button" class="theme-card" data-theme="sea" aria-pressed="false">
                                    <span class="theme-preview" aria-hidden="true" style="--preview-surface:#bcbf9a; --preview-board:#4a9fc4"></span>
                                    Sea
                                </button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <main id="gameview">
            <div id="boardStage">
                <div class="board-assembly">
                    <div id="boardDiv" class="gameTable canHover"></div>
                    <button type="button" id="switchBtn" class="switchBtn" onclick="submitPairMove()" disabled>
                        <span class="switch-art" aria-hidden="true">
                            <span class="switch-marble switch-marble-white"></span>
                            <img src="images/switch.svg" alt="" width="20" height="20">
                            <span class="switch-marble switch-marble-black"></span>
                        </span>
                        Switch
                    </button>
                </div>
            </div>
        </main>

    </div>

</body>

<script rel="preload" src="board.js"></script>
<script rel="preload" src="units.js"></script>
<script src="gamehelper.js?v=2"></script>
<script src="uiScript.js?v=2"></script>
<script src="peerjs.min.js?v=1.5.5"></script>

<script src="game.js?v=2"></script>

<script src="multiplayer.js?v=2"></script>

</html>
